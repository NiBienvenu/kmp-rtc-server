# Construit et publie l'image kmp-rtc-server sur GitHub Container Registry (GHCR).
#  - push sur main      -> ghcr.io/<owner>/kmp-rtc-server:latest + :sha-xxxxxxx
#  - tag v1.2.3         -> :1.2.3, :1.2, :latest
#  - pull request       -> build seulement (pas de push)
name: kmp-rtc-server

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docs/**"
      - "ktor-server/**"
      - ".github/workflows/kmp-rtc-server.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "ktor-server/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kmp-rtc-server
  # Docker Hub : <utilisateur>/kmp-rtc-server (variable DOCKERHUB_USERNAME + secret DOCKERHUB_TOKEN)
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/kmp-rtc-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ktor unit tests
        working-directory: ktor-server
        run: ./gradlew --no-daemon test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub (optionnel) : active seulement si la variable DOCKERHUB_USERNAME existe
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 pour les VPS ARM (Ampere, Graviton). Retirer pour un build plus rapide.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Copie le README.md du depot sur la page Docker Hub
      - name: Docker Hub description
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Asterisk + Ktor + MariaDB + Nginx + coturn : appels, video, conferences pour Kotlin Multiplatform"
          readme-filepath: ./README.md
