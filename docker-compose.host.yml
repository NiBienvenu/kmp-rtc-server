# Surcharge pour Linux: reseau "host" (recommande en production pour la VoIP)
#  - pas de NAT Docker sur les flux RTP (moins de latence, pas de one-way audio)
#  - pas besoin de publier 10 000 ports UDP (demarrage plus rapide)
#
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d
#
# Non disponible sur Docker Desktop (Windows/macOS): utiliser docker-compose.yml seul.
services:
  kmp-rtc-server:
    network_mode: host
    ports: !reset []
