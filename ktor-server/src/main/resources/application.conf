# Configuration Ktor.
# Dans l'image kmp-rtc-server, toutes les valeurs viennent des variables d'environnement
# (fichier /run/kmp-rtc/ktor.env genere par l'entrypoint). Les valeurs par defaut ci-dessous
# servent seulement au developpement local (cd ktor-server && ./gradlew run).

ktor {
    deployment {
        # Dans le conteneur, Ktor ecoute seulement en local: Nginx est la seule porte d'entree.
        host = "0.0.0.0"
        host = ${?KTOR_HOST}
        port = 8080
        port = ${?KTOR_PORT}
        port = ${?PORT}
    }
    application {
        modules = [ org.kmprtc.server.ApplicationKt.module ]
    }
}

jwt {
    domain = "http://localhost:8080"
    domain = ${?JWT_ISSUER}
    audience = "kmp-rtc-clients"
    audience = ${?JWT_AUDIENCE}
    realm = "kmp-rtc-server"
    realm = ${?JWT_REALM}
    # Valeur de dev seulement. L'image genere un secret aleatoire si JWT_SECRET est vide.
    secret = "dev-only-secret-change-me"
    secret = ${?JWT_SECRET}
    expiration = 86400000  # 24 heures en ms
    expiration = ${?JWT_EXPIRATION_MS}
}

database {
    host = "127.0.0.1"
    host = ${?DB_HOST}
    port = 3307
    port = ${?DB_PORT}
    name = "kmp_rtc"
    name = ${?DB_NAME}
    user = "kmp_app"
    user = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}

    driverClass = "org.mariadb.jdbc.Driver"
    maxPoolSize = 10
    maxPoolSize = ${?DB_POOL_SIZE}
    # Nombre d'essais de connexion au demarrage (MariaDB peut demarrer apres Ktor).
    connectRetries = 30
    connectRetries = ${?DB_CONNECT_RETRIES}
}

http {
    # Liste separee par des virgules. "*" = tous les hotes (dev seulement).
    corsAllowedHosts = "*"
    corsAllowedHosts = ${?CORS_ALLOWED_HOSTS}
}

voip {
    # Host/IP public du serveur SIP (sans http/https). Ex: "rtc.example.com" ou "203.0.113.10"
    sipDomain = "127.0.0.1"
    sipDomain = ${?SIP_DOMAIN}

    # "udp" | "tcp" | "tls" (doit correspondre a un transport actif dans pjsip.conf)
    transport = "udp"
    transport = ${?SIP_TRANSPORT}

    # STUN pour les clients ("host:port"). Vide = pas de STUN.
    stun = ""
    stun = ${?STUN_SERVER}

    # TURN (coturn integre). Les identifiants sont temporaires (REST API TURN, HMAC-SHA1).
    turn {
        enabled = false
        enabled = ${?TURN_ENABLED}
        host = ""
        host = ${?TURN_HOST}
        port = 3478
        port = ${?TURN_PORT}
        secret = ""
        secret = ${?TURN_SECRET}
        ttlSeconds = 86400
        ttlSeconds = ${?TURN_CREDENTIAL_TTL}
    }

    # URL WebSocket SIP pour les clients Web (WebRTC). Ex: "wss://rtc.example.com/asterisk/ws"
    wsUri = ""
    wsUri = ${?SIP_WS_URI}

    # Prefixe des numeros de salles de conference (doit correspondre a extensions.conf)
    conferencePrefix = "8"
    conferencePrefix = ${?CONFERENCE_PREFIX}
}

asterisk {
    # Binaire utilise pour parler a Asterisk via le socket de controle (asterisk -rx ...)
    cli = "asterisk"
    cli = ${?ASTERISK_CLI}

    provisioning {
        # true: le backend ecrit les comptes SIP dans un fichier inclus par pjsip.conf
        enabled = true
        enabled = ${?ASTERISK_PROVISIONING_ENABLED}

        # Fichier genere par Ktor et inclus par pjsip.conf (#include)
        includeFile = "/var/lib/kmp-rtc/asterisk/pjsip_users.conf"
        includeFile = ${?ASTERISK_PJSIP_INCLUDE_FILE}

        # Templates declares dans pjsip.conf de l'image
        endpointTemplate = "kmp-endpoint"
        endpointTemplate = ${?ASTERISK_ENDPOINT_TEMPLATE}
        webrtcTemplate = "kmp-endpoint-webrtc"
        webrtcTemplate = ${?ASTERISK_WEBRTC_TEMPLATE}
        authTemplate = "kmp-auth"
        aorTemplate = "kmp-aor"

        # true: cree aussi un endpoint "<user>-web" pour les clients WebRTC
        webrtcEndpoints = true
        webrtcEndpoints = ${?ASTERISK_WEBRTC_ENDPOINTS}

        # Context dialplan des endpoints (extensions.conf)
        context = "kmp-internal"
        context = ${?ASTERISK_DIALPLAN_CONTEXT}

        # Commande executee apres une modification (format liste, pas de quoting shell)
        reloadCommand = ["asterisk", "-rx", "module reload res_pjsip.so"]

    }
}

webhooks {
    # Secret partage pour verifier la signature HMAC-SHA256 (en-tete X-Signature). Vide = webhooks refuses.
    secret = ""
    secret = ${?WEBHOOK_SECRET}
}

admin {
    # Compte admin cree au demarrage s'il n'existe pas (optionnel)
    email = ""
    email = ${?ADMIN_EMAIL}
    password = ""
    password = ${?ADMIN_PASSWORD}
}

recordings {
    # Dossier des enregistrements (volume). Sous-dossiers: calls/ (Asterisk), conferences/ (Asterisk), uploads/ (API)
    dir = "/var/spool/kmp-rtc/recordings"
    dir = ${?RECORDINGS_DIR}
    # Taille max d'un fichier envoye par une application (Mo)
    maxUploadMb = 500
    maxUploadMb = ${?RECORDINGS_MAX_UPLOAD_MB}
}
