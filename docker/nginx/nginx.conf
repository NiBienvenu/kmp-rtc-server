# kmp-rtc-server: Nginx (reverse proxy, TLS, docs, admin)
user www-data;
worker_processes ${NGINX_WORKER_PROCESSES};
worker_rlimit_nofile 65536;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    log_format kmp '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/kmp-rtc/nginx-access.log kmp buffer=32k flush=5s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Anti brute-force sur /auth et limite globale de l'API
    limit_req_zone $binary_remote_addr zone=kmp_auth:10m rate=${NGINX_AUTH_RATE};
    limit_req_zone $binary_remote_addr zone=kmp_api:10m rate=${NGINX_API_RATE};
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream kmp_ktor {
        server 127.0.0.1:${KTOR_PORT};
        keepalive 32;
    }

    upstream kmp_asterisk_ws {
        server 127.0.0.1:${ASTERISK_HTTP_PORT};
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen ${HTTP_PORT} default_server;
        listen [::]:${HTTP_PORT} default_server;
        server_name ${PUBLIC_HOSTNAME} _;

        # Validation Let's Encrypt (certbot --webroot -w /var/www/certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        ${NGINX_HTTP_BODY}
    }

    server {
        # nginx 1.24 (Ubuntu 24.04): http2 se declare sur "listen"
        listen ${HTTPS_PORT} ssl http2 default_server;
        listen [::]:${HTTPS_PORT} ssl http2 default_server;
        server_name ${PUBLIC_HOSTNAME} _;

        ssl_certificate     ${TLS_CERT_FILE};
        ssl_certificate_key ${TLS_KEY_FILE};

        add_header Strict-Transport-Security "max-age=31536000" always;

        include /etc/nginx/snippets/kmp-locations.conf;
    }
}
