# Routes communes HTTP/HTTPS
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

proxy_http_version 1.1;

location = / {
    return 302 /docs/;
}

# Documentation technique (generee depuis docs/*.md)
location /docs/ {
    alias /usr/share/kmp-rtc/docs/;
    index index.html;
    try_files $uri $uri/ =404;
}

# Interface d'administration: seulement la page /admin/ (les routes /admin/* restent a l'API Ktor)
location = /admin {
    return 301 /admin/;
}
location = /admin/ {
    root /usr/share/kmp-rtc;
    try_files /admin/index.html =404;
}

# Authentification: limite plus stricte (anti brute-force)
location /auth/ {
    limit_req zone=kmp_auth burst=20 nodelay;
    include /etc/nginx/snippets/kmp-proxy.conf;
    proxy_pass http://kmp_ktor;
}

# WebSocket temps reel Ktor (presence, signaux)
location = /ws {
    include /etc/nginx/snippets/kmp-proxy-ws.conf;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://kmp_ktor;
}

# WebSocket SIP pour clients WebRTC -> Asterisk
location = /asterisk/ws {
    include /etc/nginx/snippets/kmp-proxy-ws.conf;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://kmp_asterisk_ws/ws;
}

# Envoi des enregistrements audio/video par les applis (gros fichiers, pas de mise en tampon)
location = /recordings/upload {
    client_max_body_size ${RECORDINGS_MAX_UPLOAD_MB}m;
    proxy_request_buffering off;
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
    include /etc/nginx/snippets/kmp-proxy.conf;
    proxy_pass http://kmp_ktor;
}

# Liste et lecture des enregistrements (video: lecture par morceaux)
location ^~ /recordings {
    proxy_buffering off;
    proxy_read_timeout 1h;
    include /etc/nginx/snippets/kmp-proxy.conf;
    proxy_pass http://kmp_ktor;
}

# Metriques Prometheus: reseaux prives seulement
location = /metrics {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    include /etc/nginx/snippets/kmp-proxy.conf;
    proxy_pass http://kmp_ktor;
}

# API sous /api/... (prefixe retire), pratique pour un client Web
location /api/ {
    limit_req zone=kmp_api burst=100 nodelay;
    include /etc/nginx/snippets/kmp-proxy.conf;
    proxy_pass http://kmp_ktor/;
}

# Tout le reste -> API Ktor (routes historiques: /auth, /users, /sip, /rooms, ...)
location / {
    limit_req zone=kmp_api burst=100 nodelay;
    include /etc/nginx/snippets/kmp-proxy.conf;
    proxy_pass http://kmp_ktor;
}
