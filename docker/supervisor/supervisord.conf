; =============================================================================
; kmp-rtc-server: Supervisor lance et surveille tous les services
;   docker exec kmp-rtc-server supervisorctl status
;   docker exec kmp-rtc-server supervisorctl restart ktor
; Les sorties des services vont dans "docker logs" (stdout du conteneur).
; =============================================================================
[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[supervisord]
nodaemon = true
user = root
logfile = /var/log/kmp-rtc/supervisord.log
logfile_maxbytes = 10MB
logfile_backups = 3
pidfile = /run/supervisord.pid
minfds = 65536

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

; 1. Base de donnees
[program:mariadb]
command = /usr/sbin/mariadbd --defaults-file=/etc/mysql/kmp-rtc.cnf
user = mysql
autostart = %(ENV_MARIADB_ENABLED)s
autorestart = true
priority = 10
startsecs = 5
startretries = 10
stopsignal = TERM
stopwaitsecs = 60
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

; 2. Asterisk (demarre en root puis passe en utilisateur "asterisk" via -U/-G)
[program:asterisk]
command = /usr/sbin/asterisk -f -U asterisk -G asterisk -n
autostart = true
autorestart = true
priority = 20
startsecs = 5
startretries = 10
stopsignal = TERM
stopwaitsecs = 30
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

; 3. API Ktor (utilisateur "ktor", attend MariaDB tout seul)
[program:ktor]
command = /opt/kmp-rtc/bin/run-ktor.sh
user = ktor
directory = /opt/kmp-rtc/ktor
autostart = true
autorestart = true
priority = 30
startsecs = 10
startretries = 10
stopsignal = TERM
stopwaitsecs = 30
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

; 4. Nginx (maitre root pour les ports 80/443, workers en www-data)
[program:nginx]
command = /usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon off;"
autostart = true
autorestart = true
priority = 40
startsecs = 3
stopsignal = QUIT
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

; 5. coturn (STUN/TURN), optionnel: TURN_ENABLED=true|false
[program:coturn]
command = /usr/bin/turnserver -c /run/kmp-rtc/turnserver.conf
user = turnserver
autostart = %(ENV_TURN_ENABLED)s
autorestart = true
priority = 50
startsecs = 3
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true

; Rotation quotidienne des journaux Asterisk (pas de cron dans le conteneur)
[program:log-rotate]
command = /opt/kmp-rtc/bin/log-rotate.sh
autostart = true
autorestart = true
priority = 90
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
redirect_stderr = true
