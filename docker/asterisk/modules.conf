; =============================================================================
; kmp-rtc-server: modules Asterisk
; Liste blanche: seuls les modules utiles sont charges (securite, memoire, demarrage rapide).
; Pour ajouter une fonction (ex: messagerie vocale), ajoutez son module ici
; ou dans config/asterisk/modules.conf (surcharge).
; =============================================================================
[modules]
autoload = no

