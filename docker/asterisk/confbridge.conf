; kmp-rtc-server: conferences audio/video (ConfBridge)
[general]

[kmp_bridge]
type = bridge
max_members = ${CONF_MAX_MEMBERS}
; follow_talker: la video de celui qui parle est envoyee a tous (compatible SIP natif)
; sfu: chaque client recoit tous les flux (WebRTC seulement)
video_mode = ${CONF_VIDEO_MODE}
mixing_interval = 20
; Enregistrement active par salle dans extensions.conf (RECORD_CONFERENCES)
record_conference = no
record_file_timestamp = no

[kmp_user]
type = user
announce_user_count = no
announce_join_leave = no
music_on_hold_when_empty = no
quiet = yes
; Reduit le bruit et la bande passante pendant les silences
dsp_drop_silence = yes
jitterbuffer = yes
talk_detection_events = yes

[kmp_menu]
type = menu
*1 = toggle_mute
*2 = increase_talking_volume
*3 = decrease_talking_volume
*0 = leave_conference
