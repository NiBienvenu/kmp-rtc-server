; kmp-rtc-server: flux media RTP/SRTP
[general]
; Plage RTP: doit etre identique a la plage publiee par Docker et ouverte dans le pare-feu
rtpstart = ${RTP_START}
rtpend = ${RTP_END}
rtpchecksums = no
; strictrtp: ignore les paquets RTP d'une source inconnue (anti "RTP bleed")
strictrtp = yes
probation = 4
; ICE / STUN
icesupport = yes
${RTP_STUN}

${RTP_ICE_HOST_CANDIDATES}
