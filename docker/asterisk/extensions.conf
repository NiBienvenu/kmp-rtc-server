; =============================================================================
; kmp-rtc-server: plan de numerotation (dialplan)
;   600            -> test d'echo (audio + video renvoyes a l'appelant)
;   8XXXX          -> salle de conference (gerees par l'API: POST /rooms)
;   <utilisateur>  -> appel direct (comptes 7 chiffres generes par Ktor)
; Enregistrements: ${RECORDINGS_DIR} (RECORD_CALLS / RECORD_CONFERENCES)
; =============================================================================

[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]
DIAL_TIMEOUT = 45
REC_DIR = ${RECORDINGS_DIR}
REC_FORMAT = ${RECORDING_FORMAT}
RECORD_CALLS = ${RECORD_CALLS}
RECORD_CONFERENCES = ${RECORD_CONFERENCES}

[${ASTERISK_DIALPLAN_CONTEXT}]
; Test d'echo: tres utile pour verifier NAT/RTP/codecs sans second telephone
exten => 600,1,NoOp(Echo test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; Conferences
exten => _${CONFERENCE_PREFIX}XXXX,1,Goto(kmp-conference,${EXTEN},1)

; Appels entre utilisateurs (appli native + endpoint WebRTC "-web")
exten => _[0-9a-zA-Z].,1,NoOp(Call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(userfield)=direct)
 same => n,GotoIf($["${PJSIP_ENDPOINT(${EXTEN},aors)}" = ""]?unknown)
 ; Appareils connectes: appli native et/ou navigateur WebRTC ("-web")
 same => n,Set(DIAL_NATIVE=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,Set(DIAL_WEB=${PJSIP_DIAL_CONTACTS(${EXTEN}-web)})
 same => n,Set(DIAL_ALL=${DIAL_NATIVE}${IF($["${DIAL_NATIVE}" != "" & "${DIAL_WEB}" != ""]?&)}${DIAL_WEB})
 ; Utilisateur hors ligne: pas d'appel, pas d'enregistrement vide
 same => n,GotoIf($["${DIAL_ALL}" = ""]?offline)
 same => n,GosubIf($["${RECORD_CALLS}" = "yes"]?kmp-record,s,1)
 same => n,Dial(${DIAL_ALL},${DIAL_TIMEOUT})
 same => n,Hangup()
 same => n(offline),NoOp(${EXTEN} is offline)
 same => n,Set(CDR(userfield)=offline)
 same => n,Congestion(3)
 same => n,Hangup()
 same => n(unknown),NoOp(Unknown destination ${EXTEN})
 same => n,Congestion(3)
 same => n,Hangup()

exten => h,1,NoOp(Hangup ${CHANNEL} cause=${HANGUPCAUSE})

; Enregistrement audio d'un appel (MixMonitor, les deux sens melanges).
; "b" = n'enregistre que quand l'appel est decroche. Le chemin va dans le CDR (colonne recordingfile).
[kmp-record]
exten => s,1,Set(REC_FILE=${REC_DIR}/calls/${STRFTIME(${EPOCH},,%Y/%m/%d)}/${UNIQUEID}.${REC_FORMAT})
 same => n,System(mkdir -p ${REC_DIR}/calls/${STRFTIME(${EPOCH},,%Y/%m/%d)})
 same => n,Set(CDR(recordingfile)=${REC_FILE})
 same => n,MixMonitor(${REC_FILE},b)
 same => n,Return()

[kmp-conference]
; La salle doit exister et etre active dans MariaDB (table conference_rooms)
exten => _${CONFERENCE_PREFIX}XXXX,1,NoOp(Conference ${EXTEN})
 same => n,Set(CDR(userfield)=conference)
 same => n,Set(ROOM=${ODBC_ROOM(${EXTEN})})
 same => n,GotoIf($["${ROOM}" = ""]?noroom)
 same => n,Set(ARRAY(ROOM_NUM,ROOM_PIN,ROOM_MAX,ROOM_VIDEO)=${ROOM})
 same => n,Answer()
 ; Profils dynamiques bases sur kmp_bridge / kmp_user (confbridge.conf), puis reglages de la salle
 same => n,Set(CONFBRIDGE(bridge,template)=kmp_bridge)
 same => n,Set(CONFBRIDGE(user,template)=kmp_user)
 same => n,Set(CONFBRIDGE(bridge,max_members)=${ROOM_MAX})
 same => n,ExecIf($["${ROOM_PIN}" != ""]?Set(CONFBRIDGE(user,pin)=${ROOM_PIN}))
 ; Enregistrement audio de la conference (un fichier par session de salle)
 same => n,ExecIf($["${RECORD_CONFERENCES}" = "yes"]?System(mkdir -p ${REC_DIR}/conferences/${EXTEN}))
 same => n,ExecIf($["${RECORD_CONFERENCES}" = "yes"]?Set(CONFBRIDGE(bridge,record_file)=${REC_DIR}/conferences/${EXTEN}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.${REC_FORMAT}))
 same => n,ExecIf($["${RECORD_CONFERENCES}" = "yes"]?Set(CONFBRIDGE(bridge,record_conference)=yes))
 same => n,ConfBridge(${EXTEN},,,kmp_menu)
 same => n,Hangup()
 same => n(noroom),NoOp(Room ${EXTEN} not found or inactive)
 same => n,Answer()
 same => n,Playback(conf-invalid)
 same => n,Hangup()
