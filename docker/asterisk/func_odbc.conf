; Lecture des salles de conference depuis MariaDB (table geree par Ktor)
; ODBC_ROOM(<numero>) -> "numero,pin,max,video" ou vide si la salle n'existe pas
[ROOM]
dsn = kmp-mariadb
readsql = SELECT room_number, COALESCE(pin, ''), max_participants, video FROM conference_rooms WHERE room_number = '${SQL_ESC(${ARG1})}' AND active = 1 LIMIT 1
