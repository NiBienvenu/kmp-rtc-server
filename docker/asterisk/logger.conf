; kmp-rtc-server: journaux Asterisk -> /var/log/asterisk (volume)
[general]
dateformat = %F %T.%3q
rotatestrategy = rotate
exec_after_rotate = gzip -9 ${filename}.2

[logfiles]
messages.log => notice,warning,error
security.log => security
; Activer pour deboguer (verbeux):  full.log => notice,warning,error,verbose,dtmf
