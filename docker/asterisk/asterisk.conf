; kmp-rtc-server: options globales Asterisk
[directories](!)
astcachedir => /var/cache/asterisk
astetcdir => /etc/asterisk
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /usr/share/asterisk
astagidir => /usr/share/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; Asterisk demarre en root puis passe tout de suite sur l'utilisateur "asterisk" (-U/-G)
runuser = asterisk
rungroup = asterisk
verbose = ${ASTERISK_VERBOSE}
debug = 0
maxfiles = 65536
; Refuse les nouveaux appels si la charge systeme depasse cette valeur (protection)
maxload = ${ASTERISK_MAXLOAD}
transmit_silence = yes
hideconnect = yes
defaultlanguage = en
documentation_language = en_US

[files]
; Le socket de controle est partage avec Ktor (utilisateur ktor, groupe asterisk)
astctlpermissions = 0660
astctlowner = asterisk
astctlgroup = asterisk
astctl = asterisk.ctl
