; =============================================================================
; kmp-rtc-server: PJSIP (signalisation SIP)
; Genere au demarrage depuis /opt/kmp-rtc/templates/asterisk/pjsip.conf
; Les comptes utilisateurs sont ecrits par Ktor dans:
;   /var/lib/kmp-rtc/asterisk/pjsip_users.conf  (inclus en bas de ce fichier)
; =============================================================================

[global]
type = global
user_agent = kmp-rtc-server
max_forwards = 70
keep_alive_interval = 30
; Identification: d'abord par nom d'utilisateur d'authentification
endpoint_identifier_order = auth_username,username,ip
; Evite de reveler si un compte existe
unidentified_request_count = 5
unidentified_request_period = 5
unidentified_request_prune_interval = 30

[system]
type = system
timer_t1 = 500
timer_b = 32000
disable_tcp_switch = yes

; ---------------------------------------------------------------- transports
; Le NAT (external_*_address, local_net) est ajoute automatiquement si EXTERNAL_IP est defini.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:${SIP_PORT}
tos = cs3
cos = 3
${PJSIP_NAT}

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:${SIP_PORT}
tos = cs3
cos = 3
${PJSIP_NAT}

${PJSIP_TLS_TRANSPORT}

; WebSocket SIP (clients Web/WebRTC), passe par Nginx: wss://<domaine>/asterisk/ws
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0
${PJSIP_NAT}

; ---------------------------------------------------------------- templates
; Utilises par les comptes generes par Ktor. Modifier ici change TOUS les comptes.

[kmp-endpoint](!)
type = endpoint
context = ${ASTERISK_DIALPLAN_CONTEXT}
disallow = all
allow = ${CODECS_AUDIO},${CODECS_VIDEO}
; Media toujours via Asterisk: indispensable derriere NAT (evite le one-way audio)
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = yes
; SRTP (SDES). "optimistic" = chiffre si le client le propose, sinon RTP simple.
media_encryption = ${MEDIA_ENCRYPTION}
media_encryption_optimistic = yes
dtmf_mode = rfc4733
max_audio_streams = 1
max_video_streams = 1
send_rpid = yes
send_pai = yes
trust_id_inbound = no
allow_subscribe = yes
timers = yes
language = en
; QoS (DSCP): voix EF, video AF41
tos_audio = ef
tos_video = af41
cos_audio = 5
cos_video = 4
; Coupe les appels "fantomes" (plus de RTP)
rtp_keepalive = 15
rtp_timeout = 60
rtp_timeout_hold = 300

[kmp-endpoint-webrtc](!,kmp-endpoint)
; webrtc=yes active: DTLS-SRTP, ICE, AVPF, rtcp_mux, bundle
webrtc = yes
media_encryption = dtls
dtls_auto_generate_cert = yes
dtls_verify = fingerprint
dtls_setup = actpass
media_encryption_optimistic = no
max_audio_streams = 1
max_video_streams = 15

[kmp-auth](!)
type = auth
auth_type = userpass

[kmp-aor](!)
type = aor
max_contacts = 5
remove_existing = yes
remove_unavailable = yes
qualify_frequency = 30
qualify_timeout = 3
minimum_expiration = 60
default_expiration = 300

; ---------------------------------------------------------------- comptes
#include /var/lib/kmp-rtc/asterisk/pjsip_users.conf

; Ajouts manuels (trunks, comptes de test...) : monter config/asterisk/pjsip_custom.conf
#tryinclude /etc/kmp-rtc/asterisk/pjsip_custom.conf
