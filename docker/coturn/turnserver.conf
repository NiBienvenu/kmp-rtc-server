# kmp-rtc-server: coturn (STUN + TURN) pour la traversee NAT
listening-port=${TURN_PORT}
${TURN_LISTENING_IP}
${TURN_EXTERNAL_IP}
realm=${TURN_REALM}
fingerprint
# Identifiants temporaires generes par Ktor (HMAC-SHA1, "TURN REST API")
use-auth-secret
static-auth-secret=${TURN_SECRET}
# Ports de relais: a publier/ouvrir comme la plage RTP
min-port=${TURN_MIN_PORT}
max-port=${TURN_MAX_PORT}
# Limites (anti abus)
total-quota=${TURN_TOTAL_QUOTA}
user-quota=12
max-bps=0
stale-nonce=600
# Securite: pas de relais vers les reseaux prives (sauf ce conteneur, pour joindre Asterisk)
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
${TURN_ALLOWED_PEER}
# Journaux sur la sortie standard (Supervisor -> docker logs)
log-file=stdout
simple-log
pidfile=/run/kmp-rtc/turn/turnserver.pid
